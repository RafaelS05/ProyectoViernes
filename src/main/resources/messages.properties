# --- Sidebar IA ---
ia.sidebar.recent.title=Temas recientes
ia.sidebar.faq.title=Preguntas frecuentes

# --- Temas recientes (labels + prompts) ---
ia.sidebar.recent.tribucr.label=TRIBU-CR: cambios para PyMEs
ia.sidebar.recent.tribucr.prompt=Resume los cambios clave de TRIBU-CR para una PyME en Costa Rica: migraci\u00f3n desde ATV, plazos, qu\u00e9 cambia en facturaci\u00f3n electr\u00f3nica y reportes, y buenas pr\u00e1cticas de adaptaci\u00f3n.

ia.sidebar.recent.cabys.label=CABYS y clasificaci\u00f3n de productos
ia.sidebar.recent.cabys.prompt=resumidamente, Expl\u00edcame c\u00f3mo una PyME debe elegir y mantener actualizados los c\u00f3digos CABYS para productos y servicios, con ejemplos y errores comunes.

ia.sidebar.recent.receptor.label=Receptor electr\u00f3nico y aceptaci\u00f3n de comprobantes
ia.sidebar.recent.receptor.prompt=resumidamente, \u00bfQu\u00e9 debe hacer una PyME para aceptar o rechazar comprobantes electr\u00f3nicos como receptor? Dame pasos, plazos y riesgos si no gestiona la recepci\u00f3n.

ia.sidebar.recent.notas.label=Notas de cr\u00e9dito y d\u00e9bito: casos de uso
ia.sidebar.recent.notas.prompt=resumidamente, Enumera cu\u00e1ndo usar nota de cr\u00e9dito o d\u00e9bito para corregir una factura electr\u00f3nica en Costa Rica. Incluye ejemplos pr\u00e1cticos y requisitos m\u00ednimos.

ia.sidebar.recent.contingencia.label=Facturaci\u00f3n en contingencia (sin internet)
ia.sidebar.recent.contingencia.prompt=resumidamente, Gu\u00edame sobre c\u00f3mo facturar en contingencia cuando Hacienda o el proveedor est\u00e1 ca\u00eddo. Plazos para env\u00edo posterior y c\u00f3mo documentarlo.

ia.sidebar.recent.firma.label=Certificado/llave criptogr\u00e1fica de Hacienda
ia.sidebar.recent.firma.prompt=resumidamente, Explica c\u00f3mo obtener, instalar y renovar el certificado/llave criptogr\u00e1fica para facturaci\u00f3n electr\u00f3nica. Se\u00f1ala fallos t\u00edpicos y su soluci\u00f3n.

# --- Preguntas frecuentes (labels + prompts) ---
ia.sidebar.faq.quees.label=\u00bfQu\u00e9 es la facturaci\u00f3n electr\u00f3nica?
ia.sidebar.faq.quees.prompt=resumidamente, Define brevemente la facturaci\u00f3n electr\u00f3nica en Costa Rica, sus tipos de comprobante y por qu\u00e9 es obligatoria para PyMEs.

ia.sidebar.faq.primera.label=\u00bfC\u00f3mo emito mi primera factura?
ia.sidebar.faq.primera.prompt=resumidamente, Paso a paso para que una PyME emita su primera factura electr\u00f3nica: inscripci\u00f3n de actividad, certificado, proveedor, pruebas y emisi\u00f3n real.

ia.sidebar.faq.cabysbuscar.label=\u00bfC\u00f3mo busco el CABYS correcto?
ia.sidebar.faq.cabysbuscar.prompt=resumidamente, Proporciona un m\u00e9todo simple para encontrar el CABYS correcto y validarlo con el IVA aplicable. Incluye tips para servicios profesionales y ventas mixtas.

ia.sidebar.faq.iva.label=IVA 13% y tarifas reducidas
ia.sidebar.faq.iva.prompt=Resume las tarifas de IVA aplicables a PyMEs (13%, reducidas y exenciones), con ejemplos y c\u00f3mo reflejarlas en la factura electr\u00f3nica.

ia.sidebar.faq.exoneraciones.label=Exoneraciones y EXONET
ia.sidebar.faq.exoneraciones.prompt=resumidamente, Explica c\u00f3mo una PyME aplica exoneraciones en la factura usando EXONET: validaci\u00f3n del documento, porcentaje exento y respaldo requerido.

ia.sidebar.faq.gastos.label=Gastos deducibles y respaldo
ia.sidebar.faq.gastos.prompt=resumidamente, Lista los principales gastos deducibles para PyME en Costa Rica y el respaldo m\u00ednimo exigido (comprobante electr\u00f3nico, m\u00e9todo de pago, control interno).

ia.sidebar.faq.sinpe.label=Ventas con SINPE M\u00f3vil y control de caja
ia.sidebar.faq.sinpe.prompt=resumidamente, \u00bfC\u00f3mo registrar ventas cobradas por SINPE M\u00f3vil? Da buenas pr\u00e1cticas de conciliaci\u00f3n bancaria, arqueos y referencia en la factura.


