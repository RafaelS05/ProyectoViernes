<!-- templates/usuario/fragmentos.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>


        <!-- Fragmento: Formulario de registro completo -->
        <div th:fragment="registro-formulario">
            <main class="container my-5">
                <h2 class="text-center mb-4" th:text="#{usuario.titulo.registro}"></h2>
                <div class="p-4 rounded-4 registro-container">


                    <!-- Mensaje de éxito -->
                    <div th:if="${param.exito}" class="alert alert-success text-center" role="alert">
                        <p th:text="#{usuario.registro.exito}"></p>
                    </div>

                    <!-- Formulario -->
                    <form th:action="@{/usuario/registrar}" th:object="${usuario}" method="post" novalidate>

                        <!-- Cédula -->
                        <div class="mb-3">
                            <div class="texto-entrada"><label for="cedula" class="form-label" th:text="#{usuario.cedula}"></label></div>
                            <input type="text" th:field="*{cedula}" class="form-control campo-entrada" id="cedula" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('cedula')}" th:errors="*{cedula}"></div>
                        </div>

                        <!-- Nombre completo -->
                        <div class="mb-3">
                            <div class="texto-entrada"><label for="nombreCompleto" class="form-label" th:text="#{usuario.nombrecompleto}"></label></div>
                            <input type="text" th:field="*{nombreCompleto}" class="form-control campo-entrada" id="nombreCompleto" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('nombreCompleto')}" th:errors="*{nombreCompleto}"></div>
                        </div>

                        <!-- Correo -->
                        <div class="mb-3">
                            <div class="texto-entrada"><label for="correo" class="form-label" th:text="#{usuario.correo}"></label></div>
                            <input type="email" th:field="*{correo}" class="form-control campo-entrada" id="correo" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                        </div>

                        <!-- Contraseña -->
                        <div class="mb-3">
                            <div class="texto-entrada"><label for="contrasena" class="form-label" th:text="#{usuario.contrasena}"></label></div>
                            <input type="password" th:field="*{contrasena}" class="form-control campo-entrada" id="contrasena" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"></div>
                        </div>

                        <!-- Botones -->
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/}" class="btn btn-outline-secondary" th:text="#{boton.atras}"></a>
                            <a th:href="@{/pyme/registro}" class="btn btn-siguiente" th:text="#{boton.siguiente}"></a>
                        </div>
                    </form>
                </div>


            </main>
        </div>

        <!-- Barra de plataformas externas -->
        <div th:fragment="barra-plataformas" class="plataformas-externas mt-4 p-4 text-center">
            <p class="mb-3 fs-5 text-dark fw-bold" th:text="#{usuario.crear.usando}"></p>

            <div class="d-flex justify-content-between flex-wrap">
                <div class="d-flex gap-5">
                    <i class="fas fa-envelope fa-3x"></i>
                    <i class="fab fa-facebook fa-3x"></i>
                    <i class="fab fa-instagram fa-3x"></i>
                </div>

                <div class="d-flex gap-5">
                    <i class="fab fa-github fa-3x"></i>
                    <i class="fab fa-medium fa-3x"></i>
                    <i class="fas fa-users fa-3x"></i>
                </div>
            </div>
        </div>


        <!-- Imagen decorativa (ancho completo, 200px alto) -->
        <div th:fragment="imagen-registro" class="mt-4">
            <img th:src="@{/img/contabilidad.png}" alt="banner" class="img-fluid w-100" style="height: 600px; object-fit: cover;">
        </div>

    </body>
</html>
