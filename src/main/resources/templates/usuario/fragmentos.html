<!-- templates/usuario/fragmentos.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>


        <div th:fragment="registro-formulario">
            <main class="container my-5">
                <h2 class="text-center mb-4" th:text="#{usuario.titulo.registro}"></h2>

                <div class="p-4 rounded-4 registro-container">

                    <!-- Mensaje de éxito -->
                    <div th:if="${param.exito}" class="alert alert-success text-center" role="alert">
                        <p th:text="#{usuario.registro.exito}"></p>
                    </div>

                    <!-- Formulario -->
                    <form th:action="@{/usuario/guardar}" th:object="${usuario}" method="post" enctype="multipart/form-data" novalidate>

                        <!-- Contenedor avatar -->
                        <div class="avatar-wrapper text-center mb-4">

                            <img id="avatarPreview"
                                 th:src="@{/img/default-avatar.jpg}"  
                                 alt="avatar"
                                 class="avatar-circle">

                            <input type="file"
                                   id="avatarInput"
                                   name="imagenFile"
                                   accept="image/*"
                                   onchange="cargarAvatar(event)"
                                   hidden>

                            <label for="avatarInput" class="avatar-btn">
                                <i class="fas fa-camera"></i>
                            </label>
                        </div>

                        <!-- Cédula -->
                        <div class="mb-3 texto-entrada">
                            <label for="cedula" class="form-label" th:text="#{usuario.cedula}"></label>
                            <input type="text" th:field="*{cedula}" class="form-control " id="cedula" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('cedula')}" th:errors="*{cedula}"></div>
                        </div>

                        <!-- Nombre completo -->
                        <div class="mb-3 texto-entrada">
                            <label for="nombreCompleto" class="form-label" th:text="#{usuario.nombrecompleto}"></label>
                            <input type="text" th:field="*{nombreCompleto}" class="form-control " id="nombreCompleto" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('nombreCompleto')}" th:errors="*{nombreCompleto}"></div>
                        </div>

                        <!-- Correo -->
                        <div class="mb-3 texto-entrada">
                            <label for="correo" class="form-label" th:text="#{usuario.correo}"></label>
                            <input type="email" th:field="*{correo}" class="form-control " id="correo" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                        </div>

                        <!-- Contraseña -->
                        <div class="mb-3 texto-entrada">
                            <label for="contrasena" class="form-label" th:text="#{usuario.contrasena}"></label>
                            <input type="password" th:field="*{contrasena}" class="form-control " id="contrasena" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"></div>
                        </div>

                        <!-- Botones -->
                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/}" class="btn btn-outline-secondary" th:text="#{boton.atras}"></a>
                            <button type="submit" class="btn btn-siguiente" th:text="#{boton.siguiente}"></button>
                        </div>

                    </form>
                </div>
            </main>
        </div>




    </main>
</div>

<!-- Barra de plataformas externas -->
<div th:fragment="barra-plataformas" class="plataformas-externas mt-4 p-4 text-center">
    <p class="mb-3 fs-5 text-dark fw-bold" th:text="#{usuario.crear.usando}"></p>

    <div class="d-flex justify-content-between flex-wrap">
        <div class="d-flex gap-5">
            <i class="fas fa-envelope fa-3x"></i>
            <i class="fab fa-facebook fa-3x"></i>
            <i class="fab fa-instagram fa-3x"></i>
        </div>

        <div class="d-flex gap-5">
            <i class="fab fa-github fa-3x"></i>
            <i class="fab fa-medium fa-3x"></i>
            <i class="fas fa-users fa-3x"></i>
        </div>
    </div>
</div>


<div th:fragment="imagen-registro" class="mt-4">
    <img th:src="@{/img/contabilidad.png}" alt="banner" class="img-fluid w-100" style="height: 600px; object-fit: cover;">
</div>



<!-- Fragmento: Formulario de inicio de sesión -->
<div th:fragment="formulario-login">
    <main class="container my-5">
        <h2 class="text-center mb-4" th:text="#{usuario.titulo.login}"></h2>

        <div class="p-4 rounded-4 shadow registro-container mx-auto bg-white" style="max-width: 420px;">

            <!-- Mensaje de error -->
            <div th:if="${param.error}" class="alert alert-danger text-center" role="alert">
                <p th:text="#{usuario.login.error}"></p>
            </div>

            <!-- Mensaje de cierre de sesión -->
            <div th:if="${param.logout}" class="alert alert-success text-center" role="alert">
                <p th:text="#{usuario.logout.exito}"></p>
            </div>

            <form th:action="@{/login}" method="post">

                <!-- Correo -->
                <div class="mb-3">
                    <label for="correo" class="form-label" th:text="#{usuario.correo}"></label>
                    <input type="email" class="form-control" id="correo" name="username" required autocomplete="email">
                </div>

                <!-- Contraseña -->
                <div class="mb-3">
                    <label for="contrasena" class="form-label" th:text="#{usuario.contrasena}"></label>
                    <input type="password" class="form-control" id="contrasena" name="password" required autocomplete="current-password">
                </div>

                <!-- Botón -->
                <div class="d-grid">
                    <button type="submit" class="btn btn-siguiente" th:text="#{usuario.boton.login}"></button>
                </div>

                <!-- Enlace a registro -->
                <div class="text-center mt-3">
                    <p th:text="#{usuario.no.tiene.cuenta}"></p>
                    <a th:href="@{/usuario/registro}" th:text="#{usuario.enlace.registro}"></a>
                </div>
            </form>
        </div>
    </main>
</div>

<div th:fragment="perfil-formulario">
    <main class="container my-5">
        <h2 class="text-center mb-4" th:text="#{usuario.perfil.titulo}"></h2>

        <!-- Botón editar -->
        <div class="text-end mb-3">
            <button class="btn btn-outline-secondary" id="btnEditarPerfil" onclick="mostrarFormularioPerfil()">
                <i class="fas fa-pen"></i> <span th:text="#{boton.editar}"></span>
            </button>
        </div>

        <!-- Vista solo lectura -->
        <div id="vistaPerfil" class="p-4 rounded-4 registro-container mx-auto" style="max-width: 650px;">
            <div class="text-center mb-4">
                <img th:src="${usuario.imagenPerfil != null} ? ${usuario.imagenPerfil} : @{/img/default-avatar.jpg}"
                     alt="avatar"
                     class="avatar-circle">
            </div>
            <p><strong th:text="#{usuario.cedula}"></strong> <span th:text="${usuario.cedula}"></span></p>
            <p><strong th:text="#{usuario.nombrecompleto}"></strong> <span th:text="${usuario.nombreCompleto}"></span></p>
            <p><strong th:text="#{usuario.correo}"></strong> <span th:text="${usuario.correo}"></span></p>
        </div>

        <!-- Formulario de edición -->
        <div id="formularioPerfil" class="p-4 rounded-4 registro-container mx-auto" style="max-width: 650px; display: none;">
            <form th:action="@{/usuario/perfil/guardar}" th:object="${usuario}" method="post" enctype="multipart/form-data" novalidate>

                <!-- Imagen -->
                <div class="avatar-wrapper text-center mb-4">
                    <img id="avatarPreview"
                         th:src="${usuario.imagenPerfil != null} ? ${usuario.imagenPerfil} : @{/img/default-avatar.jpg}"
                         alt="avatar"
                         class="avatar-circle">
                    <input type="file" id="avatarInput" name="imagenFile" accept="image/*" onchange="cargarAvatar(event)" hidden>
                    <label for="avatarInput" class="avatar-btn">
                        <i class="fas fa-camera"></i>
                    </label>
                </div>

                <!-- Cédula solo lectura -->
                <p class="texto-entrada">
                    <strong th:text="#{usuario.cedula}"></strong>
                    <span th:text="| ${usuario.cedula} |"></span>
                </p>
                <p class="cedula.editar text-muted fst-italic" th:text="#{mensaje.cedula.editar}">.</p>

                <!-- Nombre -->
                <div class="mb-3 texto-entrada">
                    <label for="nombreCompleto" class="form-label" th:text="#{usuario.nombrecompleto}"></label>
                    <input type="text" th:field="*{nombreCompleto}" class="form-control campo-entrada" id="nombreCompleto" required>
                </div>

                <!-- Correo -->
                <div class="mb-3 texto-entrada">
                    <label for="correo" class="form-label" th:text="#{usuario.correo}">Correo</label>
                    <input type="email" th:field="*{correo}" class="form-control campo-entrada" id="correo" required>
                </div>

                <!-- Contraseña -->
                <div class="mb-3 texto-entrada">
                    <label for="contrasena" class="form-label" th:text="#{usuario.contrasena}">Contraseña</label>
                    <input type="password" th:field="*{contrasena}" class="form-control campo-entrada" id="contrasena" placeholder="Dejar en blanco para mantener actual">
                </div>

                <!-- Botones -->
                <div class="d-flex justify-content-end mt-4 gap-2">
                    <button type="submit" class="btn btn-primary" th:text="#{boton.guardar}"></button>
                    <button type="button" class="btn btn-secondary" onclick="cancelarEdicionPerfil()" th:text="#{boton.cancelar}"></button>
                </div>
            </form>
        </div>
    </main>
</div>



</body>
</html>
