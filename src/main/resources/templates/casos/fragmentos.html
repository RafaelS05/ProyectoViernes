<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


    <div th:fragment="formulario-caso">
        <div class="container mt-4">
            <h2 th:text="#{caso.form.titulo}">Registrar Caso</h2>
            <form th:action="@{/casos/guardar}" th:object="${caso}" method="post">

                <input type="hidden" th:field="*{idCaso}" />
                <input type="hidden" th:field="*{cedulaUsuario}" id="cedulaUsuario" />

                <div class="mb-3">
                    <label th:for="cedulaUsuario" th:text="#{caso.cedula}">Cédula Usuario:</label>
                    <input type="text" th:field="*{cedulaUsuario}" class="form-control" readonly />
                </div>

                <div class="mb-3">
                    <label th:for="descripcion" th:text="#{caso.descripcion}">Descripción:</label>
                    <textarea th:field="*{descripcion}" class="form-control" required></textarea>
                </div>

                <div class="mb-3">
                    <label th:text="#{caso.rating}">Satisfacción:</label>
                    <div id="estrellas" class="d-flex gap-1 fs-4">
                        <i class="fa-regular fa-star" data-value="1"></i>
                        <i class="fa-regular fa-star" data-value="2"></i>
                        <i class="fa-regular fa-star" data-value="3"></i>
                        <i class="fa-regular fa-star" data-value="4"></i>
                        <i class="fa-regular fa-star" data-value="5"></i>
                    </div>
                    <input type="hidden" th:field="*{rating}" id="rating" />
                </div>

                <button type="submit" class="btn btn-success" th:text="#{boton.guardar}">Guardar</button>
                <a th:href="@{/casos/lista}" class="btn btn-outline-secondary" th:text="#{boton.cancelar}">Cancelar</a>
            </form>
        </div>
    </div>



    <div th:fragment="tabla-casos">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 th:text="#{caso.lista.titulo}">Casos de éxito</h2>
            <div>
                <a th:href="@{/casos/nuevo}" class="btn btn-primary me-2">Agregar caso</a>
            </div>
        </div>

        <div class="row g-3" th:each="caso : ${casos}">
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm">
                    <div class="card-body d-flex">
                        <img th:src="${caso.usuario.imagenPerfil}" class="rounded-circle me-3" style="width: 50px; height: 50px; object-fit: cover;" alt="Foto de perfil" />
                        <div>
                            <h6 class="card-subtitle mb-1 text-muted" th:text="${caso.usuario.nombreCompleto}">Nombre del usuario</h6>
                            <p class="card-text" th:text="${caso.descripcion}">Descripción del caso</p>
                            <div>
                                <i th:each="i : ${#numbers.sequence(1,5)}"
                                   th:class="${i <= caso.rating} ? 'fa-solid fa-star text-warning' : 'fa-regular fa-star text-secondary'"
                                   class="me-1"></i>
                            </div>
                            <div class="text-muted small mt-1" th:text="${#temporals.format(caso.fechaCreacion, 'dd/MM/yyyy HH:mm')}">Fecha</div>

                            <div class="mt-2 d-flex gap-2" 
                                 th:if="${usuarioLogueado != null and usuarioLogueado.cedula == caso.cedulaUsuario}">

                                <a th:href="@{'/casos/editar/' + ${caso.idCaso}}" 
                                   class="btn btn-sm btn-outline-primary mt-2" 
                                   th:text="#{boton.editar}">Editar</a>

                                <a href="#" class="btn btn-sm btn-outline-danger mt-2"
                                   data-bs-toggle="modal"
                                   data-bs-target="#confirmarEliminarModal"
                                   th:onclick="'setEliminarUrl(\'/casos/eliminar/' + ${caso.idCaso} + '\')'">
                                    <span th:text="#{boton.eliminar}">Eliminar</span>
                                </a>


                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:fragment="modal-eliminar">
        <div class="modal fade" id="confirmarEliminarModal" tabindex="-1" aria-labelledby="confirmarEliminarLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">

                    <div class="modal-header bg-danger text-white">
                        <h5 class="modal-title" id="confirmarEliminarLabel" th:text="#{modal.eliminar.titulo}">¿Estás seguro?</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>

                    <div class="modal-body" th:text="#{modal.eliminar.mensaje}">
                        Esta acción no se puede deshacer. ¿Deseas eliminar este caso?
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" th:text="#{boton.cancelar}">Cancelar</button>
                        <a id="btnConfirmarEliminar" href="#" class="btn btn-danger" th:text="#{boton.confirmar}">Eliminar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>


</html>
